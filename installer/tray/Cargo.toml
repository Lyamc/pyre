[package]
name = "pyre-tray"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "pyre notification-area (tray) icon: status, Open, Start/Stop, Quit. HTTP + process control only; no Burn/GPU code."
build = "build.rs"

[workspace]

[dependencies]
tray-icon = "0.21"
toml = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
