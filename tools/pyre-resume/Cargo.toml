[package]
name = "pyre-resume"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Durable chat-generation journal, SSE terminal events, and resume planning for pyre"
publish = false

# Own workspace so `cargo test` here does not load pyre's Burn patches.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "signal", "io-util"] }
axum = "0.8"
futures = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "io-util"] }
tempfile = "3"
