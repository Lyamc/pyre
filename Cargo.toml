[package]
name = "pyre"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "llama.cpp-server-style LLM inference server where Burn runs the model"

[features]
stt = ["dep:whisburn-core", "dep:whisburn-audio", "dep:whisburn-engine", "dep:whisburn-models"]
default = ["cuda", "wgpu", "flex", "ndarray", "stt"]
cuda = ["burn/cuda"]
wgpu = ["burn/wgpu"]
vulkan = ["burn/vulkan"]
flex = ["burn/flex", "burn/rayon"]
ndarray = ["burn/ndarray"]

[dependencies]
burn = { version = "0.22.1", default-features = false, features = ["std", "fusion", "autotune"] }
safetensors = "0.8"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
hf-hub = { version = "1.0", features = ["blocking"] }
minijinja = { version = "3", features = ["serde", "json", "builtins", "macros", "loop_controls"] }
minijinja-contrib = { version = "3", features = ["pycompat"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
memmap2 = "0.9"
toml = "0.9"
sha2 = "0.10"
same-file = "1"
sysinfo = "0.37"
# Speech-to-text: the user's whisburn project (burn 0.21), pinned to a commit of the local repo.
# A git dependency (not a path dep) so pyre builds against committed whisburn code and never
# touches or depends on its working tree. Optional so `--no-default-features` skips burn 0.21.
whisburn-core = { git = "file:///C:/Build/machine-learning/whisburn", rev = "d27f1fc", optional = true }
whisburn-audio = { git = "file:///C:/Build/machine-learning/whisburn", rev = "d27f1fc", optional = true }
whisburn-engine = { git = "file:///C:/Build/machine-learning/whisburn", rev = "d27f1fc", optional = true }
whisburn-models = { git = "file:///C:/Build/machine-learning/whisburn", rev = "d27f1fc", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false
codegen-units = 16

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
