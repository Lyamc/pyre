[workspace]
resolver = "2"
members = [".", "crates/*"]
exclude = ["third_party/hf-hub", "gui", "vendor/**"]

[workspace.dependencies]
# ONE Burn for the whole workspace: Lyamc/burn @ pyre-fused-quant (matches vendor/burn-pyre submodule).
burn = { git = "https://github.com/Lyamc/burn", rev = "4b9af57ff044b0e3157b985361a4c6f2004f3ae7", default-features = false, features = ["std"] }
burn-store = { git = "https://github.com/Lyamc/burn", rev = "4b9af57ff044b0e3157b985361a4c6f2004f3ae7", default-features = false, features = ["std", "safetensors"] }
pyre-whisper-core = { path = "crates/pyre-whisper-core" }
pyre-whisper-audio = { path = "crates/pyre-whisper-audio" }
pyre-whisper-engine = { path = "crates/pyre-whisper-engine", default-features = false }
pyre-whisper-models = { path = "crates/pyre-whisper-models" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
ureq = { version = "3", default-features = false, features = ["native-tls"] }
hf-hub = { path = "third_party/hf-hub", default-features = false, features = ["ureq", "native-tls"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "flac", "ogg", "pcm", "aac", "isomp4", "mkv", "vorbis"] }
rubato = "5"
hound = "3.5"
tokenizers = { version = "0.23", default-features = false, features = ["onig", "progressbar"] }
npy = { git = "https://github.com/Lyamc/npy-rs" }
strum = "0.28"
strum_macros = "0.28"
flate2 = "1.0"
indicatif = "0.18"
regex = "1.11"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde", "js"] }
tempfile = "3"
safetensors = "0.8"
half = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
[package]
name = "pyre"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "llama.cpp-server-style LLM inference server where Burn runs the model"

[features]
image = ["dep:pyre-sd", "dep:image"]
stt = ["dep:pyre-whisper-core", "dep:pyre-whisper-audio", "dep:pyre-whisper-engine", "dep:pyre-whisper-models"]
default = ["cuda", "wgpu", "flex", "stt", "image"]
cuda = ["burn/cuda"]
wgpu = ["burn/wgpu"]
vulkan = ["burn/vulkan"]
flex = ["burn/flex", "burn/rayon"]

[dependencies]
# cubecl-env-direct: StreamId for the expert copy stream (same crate as the [patch] below)
cubecl-environment = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
burn = { workspace = true, default-features = false, features = ["std", "fusion", "autotune", "persistence"] }
safetensors = "0.8"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
hf-hub = { version = "1.0", features = ["blocking"] }
minijinja = { version = "3", features = ["serde", "json", "builtins", "macros", "loop_controls"] }
minijinja-contrib = { version = "3", features = ["pycompat"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
regex = "1.11"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
memmap2 = "0.9"
rayon = "1"
half = "2"
# GGUF (Q8_0 kept packed as Burn Q8F blocks; K-quants dequantized). Local port of Lyamc/burn-gguf to the burn fork.
burn-gguf = { path = "vendor/burn-gguf", default-features = false, features = ["std", "memmap"] }
toml = "0.9"
sha2 = "0.10"
same-file = "1"
sysinfo = "0.37"
matrixmultiply = "0.3"
nvml-wrapper = "0.13"
# Same revision as the workspace Burn. The fused-quant helpers kquant calls
# (`set_fused_qmatmul`) live on this rev; 9db7598 does not export them.
burn-cubecl = { git = "https://github.com/Lyamc/burn", rev = "4b9af57ff044b0e3157b985361a4c6f2004f3ae7", default-features = false, features = ["std"] }
# Image generation: Stable Diffusion, vendored from oxiglade/diffusers-burn (MIT/Apache) and ported to the workspace Burn.
pyre-sd = { path = "crates/pyre-sd", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"], optional = true }
vtracer = { version = "0.6", default-features = false }
visioncortex = "0.8"
# Image tagger: reads PyTorch .pt checkpoints in place (same Burn fork, no torch).
pytorch-reader = { git = "https://github.com/Lyamc/burn", rev = "4b9af57ff044b0e3157b985361a4c6f2004f3ae7" }
base64 = "0.22"
# Speech-to-text: Whisper (and friends) vendored from the user's whisburn @ d27f1fc, now owned by pyre.
pyre-whisper-core = { path = "crates/pyre-whisper-core", optional = true }
pyre-whisper-audio = { path = "crates/pyre-whisper-audio", optional = true }
pyre-whisper-engine = { path = "crates/pyre-whisper-engine", optional = true }
pyre-whisper-models = { path = "crates/pyre-whisper-models", optional = true }
# Journal, SSE terminal contract, and resume planning. No Burn dependency.
pyre-resume = { path = "crates/pyre-resume" }
pyre-voice-clone = { path = "crates/pyre-voice-clone" }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false
codegen-units = 16

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Vendored forks are git submodules under vendor/ (same commits as these revs).
# Burn is pinned via workspace.dependencies git rev (matches vendor/burn-pyre).
# CubeCL is [patch]ed from tracel-ai/cubecl -> Lyamc/cubecl-pipe (different URL; matches vendor/cubecl-pipe).
# burn-gguf is a single crate: path = vendor/burn-gguf (its Burn deps use the same rev).

# Vendored CubeCL: Lyamc/cubecl-pipe @ pyre-hostmem (Windows WAL / host-mem extensions).
[patch."https://github.com/tracel-ai/cubecl"]
cubecl-environment = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-common = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-core = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-cpp = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-cpu = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-cuda = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-hip = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-ir = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-llvm = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-macros = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-macros-internal = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-metal = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-monitoring = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-opt = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-runtime = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-server = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-spirv = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-std = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-tile = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-wgpu = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }
cubecl-zspace = { git = "https://github.com/Lyamc/cubecl-pipe", rev = "29f42dbef208b63f1b9d8cb1a689aea4d6aab5bd" }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
