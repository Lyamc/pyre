[workspace]
resolver = "2"
members = [".", "crates/*"]
exclude = ["third_party/hf-hub", "gui"]

[workspace.dependencies]
# ONE Burn for the whole workspace: Lyamc's fork, pinned (main @ 2026-10-26).
burn = { git = "https://github.com/Lyamc/burn", rev = "9db7598f09ce29036a949a8635343f8a58780d4f", default-features = false, features = ["std"] }
burn-store = { git = "https://github.com/Lyamc/burn", rev = "9db7598f09ce29036a949a8635343f8a58780d4f", default-features = false, features = ["std", "safetensors"] }
pyre-whisper-core = { path = "crates/pyre-whisper-core" }
pyre-whisper-audio = { path = "crates/pyre-whisper-audio" }
pyre-whisper-engine = { path = "crates/pyre-whisper-engine", default-features = false }
pyre-whisper-models = { path = "crates/pyre-whisper-models" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
ureq = { version = "3", default-features = false, features = ["native-tls"] }
hf-hub = { path = "third_party/hf-hub", default-features = false, features = ["ureq", "native-tls"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "flac", "ogg", "pcm", "aac", "isomp4", "mkv", "vorbis"] }
rubato = "5"
hound = "3.5"
tokenizers = { version = "0.23", default-features = false, features = ["onig", "progressbar"] }
npy = { git = "https://github.com/Lyamc/npy-rs" }
strum = "0.28"
strum_macros = "0.28"
flate2 = "1.0"
indicatif = "0.18"
regex = "1.11"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde", "js"] }
tempfile = "3"
safetensors = "0.8"
half = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
[package]
name = "pyre"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "llama.cpp-server-style LLM inference server where Burn runs the model"

[features]
image = ["dep:pyre-sd", "dep:image"]
stt = ["dep:pyre-whisper-core", "dep:pyre-whisper-audio", "dep:pyre-whisper-engine", "dep:pyre-whisper-models"]
default = ["cuda", "wgpu", "flex", "stt", "image"]
cuda = ["burn/cuda"]
wgpu = ["burn/wgpu"]
vulkan = ["burn/vulkan"]
flex = ["burn/flex", "burn/rayon"]

[dependencies]
burn = { workspace = true, default-features = false, features = ["std", "fusion", "autotune", "persistence"] }
safetensors = "0.8"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
hf-hub = { version = "1.0", features = ["blocking"] }
minijinja = { version = "3", features = ["serde", "json", "builtins", "macros", "loop_controls"] }
minijinja-contrib = { version = "3", features = ["pycompat"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
memmap2 = "0.9"
rayon = "1"
half = "2"
# GGUF (Q8_0 kept packed as Burn Q8F blocks; K-quants dequantized). Local port of Lyamc/burn-gguf to the burn fork.
burn-gguf = { path = "../burn-gguf", default-features = false, features = ["std", "memmap"] }
toml = "0.9"
sha2 = "0.10"
same-file = "1"
sysinfo = "0.37"
matrixmultiply = "0.3"
nvml-wrapper = "0.13"
# Only for the fused-quant switch in tests/benches (patched to the local fork).
burn-cubecl = { git = "https://github.com/Lyamc/burn", rev = "9db7598f09ce29036a949a8635343f8a58780d4f", default-features = false, features = ["std"] }
# Image generation: Stable Diffusion, vendored from oxiglade/diffusers-burn (MIT/Apache) and ported to the workspace Burn.
pyre-sd = { path = "crates/pyre-sd", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
base64 = "0.22"
# Speech-to-text: Whisper (and friends) vendored from the user's whisburn @ d27f1fc, now owned by pyre.
pyre-whisper-core = { path = "crates/pyre-whisper-core", optional = true }
pyre-whisper-audio = { path = "crates/pyre-whisper-audio", optional = true }
pyre-whisper-engine = { path = "crates/pyre-whisper-engine", optional = true }
pyre-whisper-models = { path = "crates/pyre-whisper-models", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false
codegen-units = 16

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Local fix (not pushed): cubecl's Turso kernel cache requests multiprocess WAL, unsupported on Windows.
# Local branch of the burn fork (not pushed): fused dequant+matmul for block-quantized weights.
[patch."https://github.com/Lyamc/burn"]
burn-cubecl = { path = "../burn-pyre/crates/burn-cubecl" }
burn-cubecl-fusion = { path = "../burn-pyre/crates/burn-cubecl-fusion" }
burn = { path = "../burn-pyre/crates/burn" }
burn-autodiff = { path = "../burn-pyre/crates/burn-autodiff" }
burn-backend = { path = "../burn-pyre/crates/burn-backend" }
burn-backend-extension = { path = "../burn-pyre/crates/burn-backend-extension" }
burn-core = { path = "../burn-pyre/crates/burn-core" }
burn-cpu = { path = "../burn-pyre/crates/burn-cpu" }
burn-cuda = { path = "../burn-pyre/crates/burn-cuda" }
burn-derive = { path = "../burn-pyre/crates/burn-derive" }
burn-dispatch = { path = "../burn-pyre/crates/burn-dispatch" }
burn-einsum = { path = "../burn-pyre/crates/burn-einsum" }
burn-flex = { path = "../burn-pyre/crates/burn-flex" }
burn-fusion = { path = "../burn-pyre/crates/burn-fusion" }
burn-instrument = { path = "../burn-pyre/crates/burn-instrument" }
burn-instrument-macros = { path = "../burn-pyre/crates/burn-instrument-macros" }
burn-ir = { path = "../burn-pyre/crates/burn-ir" }
burn-linalg = { path = "../burn-pyre/crates/burn-linalg" }
burn-nn = { path = "../burn-pyre/crates/burn-nn" }
burn-optim = { path = "../burn-pyre/crates/burn-optim" }
burn-pack = { path = "../burn-pyre/crates/burn-pack" }
burn-remote = { path = "../burn-pyre/crates/burn-remote" }
burn-rocm = { path = "../burn-pyre/crates/burn-rocm" }
burn-router = { path = "../burn-pyre/crates/burn-router" }
burn-signal = { path = "../burn-pyre/crates/burn-signal" }
burn-std = { path = "../burn-pyre/crates/burn-std" }
burn-store = { path = "../burn-pyre/crates/burn-store" }
burn-tensor = { path = "../burn-pyre/crates/burn-tensor" }
burn-vision = { path = "../burn-pyre/crates/burn-vision" }
burn-wgpu = { path = "../burn-pyre/crates/burn-wgpu" }

[patch."https://github.com/tracel-ai/cubecl"]
cubecl-environment = { path = "../cubecl-pyre-fix/crates/cubecl-environment" }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
